[project]
name = "sediment"
version = "0.1.0"
description = "Knowledge pipeline: fetch raw data from YouTrack/Mattermost and index into Qdrant"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27",
    "knowledge-schema",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "qdrant-client>=1.17.1",
]

[project.scripts]
raw-fetch = "sediment.raw_fetch:main"
sediment-load = "sediment.load:main"
sediment-backfill-acl = "sediment.backfill_acl:main"
sediment-backfill-lc = "sediment.backfill_lc:main"
sediment-backfill-ts = "sediment.backfill_ts:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sediment"]

[dependency-groups]
dev = [
    "anthropic>=0.93.0",
    "bertopic>=0.17.4",
    "hdbscan>=0.8.42",
    "mkdocs-material>=9.7.6",
    "umap-learn>=0.5.12",
]
test = [
    "pytest>=8",
]
