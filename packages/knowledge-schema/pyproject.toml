[project]
name = "knowledge-schema"
version = "0.1.0"
description = "Shared knowledge-base contract (sources, embed) between sediment and sediment-mcp"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
test = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_schema"]
