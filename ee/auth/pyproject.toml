[project]
name = "sediment-mcp-ee-auth"
version = "0.2.0rc2"
description = "OAuth auth providers for sediment-mcp (ee)"
license = "Elastic-2.0"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=3,<4",
    "sediment-mcp",
    "sediment-mcp-ee-license",
    "sediment-mcp-ee-access",
]

[project.entry-points."sediment_mcp.auth_providers"]
github = "sediment_mcp_ee_auth.github:provider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sediment_mcp_ee_auth"]
