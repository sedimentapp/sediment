[project]
name = "sediment-mcp-ee-license"
version = "0.1.0"
description = "ee license verification for sediment-mcp (flat: one license enables all ee features)"
license = "Elastic-2.0"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=3,<4",
    "pyjwt[crypto]>=2",
    "sediment-mcp",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sediment_mcp_ee_license"]

[dependency-groups]
test = [
    "pytest>=8",
]
