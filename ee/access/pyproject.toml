[project]
name = "sediment-mcp-ee-access"
version = "0.2.0rc2"
description = "Versioned managed identities and access policies for sediment-mcp"
license = "Elastic-2.0"
requires-python = ">=3.14"
dependencies = ["sediment-mcp", "sediment-mcp-ee-license", "pyyaml"]

[project.entry-points."sediment_mcp.access_providers"]
database = "sediment_mcp_ee_access:provider"

[project.scripts]
sediment-mcp-access = "sediment_mcp_ee_access.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sediment_mcp_ee_access"]
