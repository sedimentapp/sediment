name: sediment-mcp — Test & Publish image

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing verified version tag to publish
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/sediment-mcp-releases

jobs:
  test:
    # Run only on GitHub, including forks.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release checkout
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 tools/check-release-tag.py --tag "$RELEASE_TAG"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Run tests, Ruff and basedpyright
        run: |
          uv sync --all-packages --no-default-groups --group test
          uv run --no-sync pytest packages ee
          uv run --no-dev --with ruff==0.15.11 ruff check .
          uv run --no-dev --with basedpyright==1.39.3 basedpyright

  build-and-push:
    # Run only on GitHub, including forks.
    if: github.server_url == 'https://github.com'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release checkout
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 tools/check-release-tag.py --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.release_tag }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/sediment-mcp/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.release_tag }}
            org.opencontainers.image.revision=${{ steps.release.outputs.commit }}
