# Example local dev profile, used by `--config-dir .` of raw-fetch/sediment-load.
# Copy it to _profile.yaml (gitignored) and put your own paths in.
# In production this file comes from a ConfigMap.

# Collections loaded by sediment-load. Host-independent: list every source that
# may end up in the collection's vault on any host — raw directories that are
# missing here are simply skipped.
collections:
  acme:
    sources: [claude, telegram, mattermost]

# A profile name matches its collection name; raw_dir is derived from
# raw_dir (<vault_path>/raw).
profiles:
  acme:
    vault_path: ~/knowledge/acme
    claude:
      projects_path: ~/.claude/projects
      pattern: "-home-user-code-acme*"
      exclude:
        - scratch
    telegram:
      api_id_env: TELEGRAM_API_ID
      api_hash_env: TELEGRAM_API_HASH
      session_path: ~/.telegram_session
      chats: []
    mattermost:
      url: https://mattermost.acme.example/
      team: acme
      token_env: MATTERMOST_TOKEN
      # Channels named by hand. Their raw directory is the name below, so
      # renaming one here orphans the files already fetched under the old name.
      channels:
        - { id: "<channel_id>", name: infra }
      # Optional: pick up channels the account joined but nobody listed above.
      # Their directory is "<name>__<channel_id>", so they need no config entry
      # to be loaded later. Every newly fetched channel is a new ACL space that
      # no grant covers yet — the fetch prints them for exactly that reason.
      discover:
        types: [O, P]           # O public, P private, G group DM, D direct
        active_within_days: 90  # optional: ignore channels dormant that long
      # Banned outright: never fetched, never indexed, and points already
      # indexed for them are purged on the next load. Beats `channels` too.
      exclude:
        ids: []
        names: []
