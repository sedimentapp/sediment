repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff-check
  - repo: local
    hooks:
      - id: basedpyright
        name: basedpyright
        entry: uv run --no-dev --with basedpyright==1.39.3 basedpyright
        language: system
        types: [python]
        pass_filenames: false
